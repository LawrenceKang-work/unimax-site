<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>UniMax · 顾客留言看板</title>
<style>
  :root{
    --navy:#22315b; --navy-2:#2c3e6e; --blue:#3f7fe0; --gold:#d4a24e;
    --ink:#1c2438; --dim:#6b7690; --line:#e6eaf2; --bg:#f4f6fb; --card:#fff;
    --ok:#2f9e6f; --chg:#e08a2b; --rmv:#d15656;
    --r:14px; --shadow:0 8px 30px rgba(24,40,80,.08);
    --sora:'Sora','Segoe UI',system-ui,sans-serif; --inter:'Inter','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--inter);line-height:1.55}
  .wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--sora);font-size:15px}
  .brand h1{margin:0;font-family:var(--sora);font-size:19px;color:var(--navy)}
  .brand p{margin:0;font-size:12px;color:var(--dim)}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--inter)}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;flex:1;min-width:130px;box-shadow:var(--shadow)}
  .stat .n{font-family:var(--sora);font-size:22px;color:var(--navy);font-weight:700}
  .stat .l{font-size:12px;color:var(--dim)}
  .banner{background:#fff7e9;border:1px solid #f0dcb4;color:#8a681f;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .banner.on{display:block}
  .block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .block-h{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(90deg,#f7f9fe,#fff);border-bottom:1px solid var(--line)}
  .block-h .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
  .block-h.page .dot{background:var(--gold)}
  .block-h h2{margin:0;font-family:var(--sora);font-size:15px;color:var(--navy);flex:1}
  .block-h .count{font-size:12px;color:var(--dim);background:#eef2fb;border-radius:999px;padding:2px 9px}
  .rec{padding:13px 16px;border-bottom:1px solid #f1f4fa;display:flex;gap:12px}
  .rec:last-child{border-bottom:0}
  .rec .st{flex-shrink:0;width:74px;text-align:center}
  .rec .st .ic{font-size:16px;display:block}
  .rec .st .lb{font-size:11px;font-weight:600;margin-top:2px}
  .st.satisfied .lb{color:var(--ok)} .st.satisfied .ic{filter:none}
  .st.change .lb{color:var(--chg)} .st.remove .lb{color:var(--rmv)}
  .rec .body{flex:1;min-width:0}
  .rec .meta{font-size:12px;color:var(--dim);margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .rec .vtag{background:var(--navy);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}
  .rec .eltag{background:#eef2fb;color:var(--navy);border-radius:6px;padding:1px 7px;font-size:11px}
  .rec .newtext{background:#eef7f1;border-left:3px solid var(--ok);border-radius:0 8px 8px 0;padding:7px 11px;font-size:14px;margin:5px 0;color:#1d4d38}
  .rec .comment{font-size:14px;color:var(--ink);margin:3px 0}
  .rec .types{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .rec .types span{background:#fff3e3;color:var(--chg);border-radius:6px;padding:1px 8px;font-size:11px}
  .rec .shot{margin-top:7px}
  .rec .shot img{max-width:150px;max-height:110px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
  .empty{text-align:center;color:var(--dim);padding:50px 20px;background:var(--card);border-radius:var(--r);border:1px dashed var(--line)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .edits{background:#fbf7ef;border:1px solid #efe3cb}
  .edits .block-h{background:linear-gradient(90deg,#fdf8ee,#fff)}
  .gate{max-width:360px;margin:80px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 24px;box-shadow:var(--shadow)}
  .foot{text-align:center;color:var(--dim);font-size:12px;margin-top:24px}
  #lb{position:fixed;inset:0;background:rgba(15,22,40,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;cursor:zoom-out}
  #lb.on{display:flex} #lb img{max-width:92vw;max-height:88vh;border-radius:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="lb"><img id="lbimg" alt=""></div>
<script>
(function(){
  "use strict";
  var API = 'https://unimax-demo.pages.dev/api/feedback?client=unimax';
  var KEY = 'unimax-2026';
  var app = document.getElementById('app');
  var params = new URLSearchParams(location.search);
  var pass = params.get('key') || params.get('edit') || '';

  if (pass !== KEY) {
    app.innerHTML = '<div class="gate"><div style="font-size:32px">🔒</div>'
      + '<h2 style="font-family:var(--sora);color:var(--navy);margin:10px 0 6px">需要访问密钥</h2>'
      + '<p style="color:var(--dim);font-size:14px">请通过带密钥的链接打开此看板。</p></div>';
    return;
  }

  var DEMO = {
    success:true, used:2, demo:true,
    rounds:[
      { round_no:1, note:'想让首屏更年轻、更有活力', created_at:'2026-07-07T10:12:00Z', records:[
        { target:'element', block_label:'首屏英雄区', el_type:'text', el_label:'主标题', status:'change', new_text:'点燃你的每一天', comment:'现在的标题太老气了' },
        { target:'block', block_label:'首屏英雄区', status:'satisfied', comment:'整体版式我很满意' },
        { target:'element', block_label:'产品介绍', el_type:'image', el_label:'产品主图', status:'change', comment:'换成实拍图会更可信', change_types:['图片'] }
      ]},
      { round_no:2, note:'', created_at:'2026-07-07T14:40:00Z', records:[
        { target:'block', block_label:'合作分级', status:'remove', comment:'这一块这次先不要展示' },
        { target:'page', status:'change', comment:'整体配色再亮一点、年轻一点', change_types:['颜色','整体风格'] }
      ]}
    ],
    latest_edit:{ text:{ 'hero-title':'点燃你的每一天' }, images:{}, videos:{}, bgs:{} }
  };

  var STMAP = {
    satisfied:{ic:'✓', lb:'满意', cls:'satisfied'},
    change:{ic:'✎', lb:'要改', cls:'change'},
    remove:{ic:'🗑', lb:'不要', cls:'remove'}
  };
  var TYPEMAP = {text:'文字', image:'图片', video:'视频', button:'按钮'};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(s){ if(!s) return ''; var d=s.replace('T',' ').slice(0,16); return d; }

  function render(j){
    var isDemo = !!j.demo;
    var rounds = j.rounds || [];
    var edit = j.latest_edit || null;
    var editCount = edit ? (Object.keys(edit.text||{}).length + Object.keys(edit.images||{}).length + Object.keys(edit.videos||{}).length + Object.keys(edit.bgs||{}).length) : 0;

    // 按板块聚合
    var byBlock = {}; var order = [];
    rounds.forEach(function(rd){
      (rd.records||[]).forEach(function(rec){
        var bl = rec.target === 'page' ? '__page__' : (rec.block_label || '其他');
        if (!byBlock[bl]) { byBlock[bl] = []; order.push(bl); }
        var r2 = {}; for (var k in rec) r2[k]=rec[k]; r2.round_no = rd.round_no;
        byBlock[bl].push(r2);
      });
    });
    // 整页留言排最后
    order.sort(function(a,b){ return (a==='__page__') - (b==='__page__'); });

    var totalRecs = rounds.reduce(function(n,rd){ return n + (rd.records?rd.records.length:0); }, 0);

    var html = ''
      + '<header class="top"><div class="brand"><div class="logo">UM</div>'
      + '<div><h1>顾客留言看板</h1><p>UniMax · unimaxofficial.com</p></div></div>'
      + '<div class="actions">'
      + '<button class="btn btn-ghost" id="btnDemo">'+(isDemo?'← 看真实数据':'👁 看示例')+'</button>'
      + '<button class="btn btn-primary" id="btnReload">↻ 刷新</button>'
      + '</div></header>';

    html += '<div class="summary">'
      + '<div class="stat"><div class="n">'+(j.used||0)+' / 6</div><div class="l">已用留言轮次</div></div>'
      + '<div class="stat"><div class="n">'+totalRecs+'</div><div class="l">留言条数</div></div>'
      + '<div class="stat"><div class="n">'+order.filter(function(b){return b!=='__page__';}).length+'</div><div class="l">涉及板块</div></div>'
      + '<div class="stat"><div class="n">'+editCount+'</div><div class="l">顾客直接改动</div></div>'
      + '</div>';

    if (isDemo) html += '<div class="banner on">👁 当前显示的是 <b>示例数据</b>,用来展示布局。点右上「看真实数据」切回云端实时留言。</div>';

    // 顾客直接编辑改动
    if (editCount) {
      html += '<div class="block edits"><div class="block-h page"><span class="dot"></span><h2>✏️ 顾客直接编辑的改动</h2><span class="count">'+editCount+' 处</span></div>';
      ['text','images','videos','bgs'].forEach(function(kind){
        var m = edit[kind]||{}; var label={text:'文字',images:'图片',videos:'视频',bgs:'背景'}[kind];
        Object.keys(m).forEach(function(key){
          html += '<div class="rec"><div class="st"><span class="ic">✏️</span><span class="lb" style="color:var(--gold)">'+label+'</span></div>'
            + '<div class="body"><div class="meta"><span class="eltag">'+esc(key)+'</span></div>'
            + (kind==='text' ? '<div class="newtext">'+esc(m[key])+'</div>' : '<div class="comment">→ '+esc(String(m[key]).slice(0,80))+'</div>')
            + '</div></div>';
        });
      });
      html += '</div>';
    }

    if (!totalRecs && !editCount) {
      html += '<div class="empty"><div class="big">📭</div><b>目前还没有顾客留言</b><br><span style="font-size:13px">顾客通过 <code>?edit=密钥</code> 提交留言后,会实时出现在这里,按板块归类。</span></div>';
    }

    // 按板块
    order.forEach(function(bl){
      var recs = byBlock[bl];
      var isPage = bl === '__page__';
      html += '<div class="block"><div class="block-h'+(isPage?' page':'')+'"><span class="dot"></span>'
        + '<h2>'+(isPage?'📄 整页留言':esc(bl))+'</h2><span class="count">'+recs.length+' 条</span></div>';
      recs.forEach(function(rec){
        var st = STMAP[rec.status] || {ic:'?',lb:rec.status,cls:''};
        html += '<div class="rec"><div class="st '+st.cls+'"><span class="ic">'+st.ic+'</span><span class="lb">'+st.lb+'</span></div><div class="body">';
        html += '<div class="meta"><span class="vtag">V'+rec.round_no+'</span>';
        if (rec.target==='element' && rec.el_type) html += '<span class="eltag">'+(TYPEMAP[rec.el_type]||rec.el_type)+(rec.el_label?' · '+esc(rec.el_label):'')+'</span>';
        if (rec.target==='block') html += '<span class="eltag">整个板块</span>';
        html += '<span>'+fmtDate(rec.ts||rec.created_at)+'</span></div>';
        if (rec.new_text) html += '<div class="newtext">改成:'+esc(rec.new_text)+'</div>';
        if (rec.new_image_url) html += '<div class="comment">🖼 新图:<a href="'+esc(rec.new_image_url)+'" target="_blank">'+esc(rec.new_image_url.slice(0,50))+'</a></div>';
        if (rec.comment) html += '<div class="comment">💬 '+esc(rec.comment)+'</div>';
        if (rec.change_types && rec.change_types.length) { html += '<div class="types">'; rec.change_types.forEach(function(c){ html+='<span>'+esc(c)+'</span>'; }); html += '</div>'; }
        if (rec.screenshot) html += '<div class="shot"><img src="'+esc(rec.screenshot)+'" data-full="'+esc(rec.screenshot)+'" alt="截图"></div>';
        html += '</div></div>';
      });
      html += '</div>';
    });

    html += '<div class="foot">数据来自云端 · 每次刷新拉取最新 · 仅你可见(带密钥)</div>';
    app.innerHTML = html;

    document.getElementById('btnReload').onclick = function(){ loadReal(); };
    document.getElementById('btnDemo').onclick = function(){ if(isDemo) loadReal(); else render(DEMO); };
    Array.prototype.forEach.call(document.querySelectorAll('.shot img'), function(im){
      im.onclick = function(){ var lb=document.getElementById('lb'); document.getElementById('lbimg').src=im.getAttribute('data-full'); lb.classList.add('on'); };
    });
  }

  function loadReal(){
    app.innerHTML = '<div class="empty"><div class="big">⏳</div>读取云端留言中…</div>';
    fetch(API, {cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if (!j || !j.success) throw new Error('bad');
      render(j);
    }).catch(function(){
      app.innerHTML = '<div class="empty"><div class="big">⚠️</div>云端暂时读取不到。<br><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">重试</button> <button class="btn btn-ghost" style="margin-top:12px" id="d2">看示例</button></div>';
      var d2=document.getElementById('d2'); if(d2) d2.onclick=function(){ render(DEMO); };
    });
  }

  document.getElementById('lb').onclick = function(){ this.classList.remove('on'); };

  loadReal();
})();
</script>
</body>
</html>
